<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cloud Services assignments</title>
    <style>
      :root {
        --bg: #e9edf0;
        --surface: #fff;
        --ink: #16222e;
        --muted: #5a6b7a;
        --rule: #ccd6dd;
        --accent: #1f5f8b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 2.5rem 1.25rem 4rem;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.6 "Iowan Old Style",
          Palatino,
          Georgia,
          serif;
      }
      main {
        max-width: 44rem;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.75rem;
        line-height: 1.2;
        margin: 0 0 2rem;
        font-weight: 600;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 1rem;
      }
      a {
        display: block;
        background: var(--surface);
        border: 1px solid var(--rule);
        padding: 1.4rem 1.5rem;
        color: var(--accent);
        font-size: 1.15rem;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover {
        border-color: var(--accent);
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Cloud Services assignments on Rahti</h1>
      <ul>
        <li><a href="/week4.html">Week 4</a></li>
        <li><a href="/week5.html">Week 5</a></li>
      </ul>
    </main>
  </body>
</html>
